<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Sertifikat Finder</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #FFD700, #FFFFFF);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        main {
            flex: 1;
        }
        #pdf-render {
            border: 1px solid #dee2e6;
            width: 100%;
            height: auto;
        }
        #pdf-viewer, #action-buttons {
            display: none;
        }
        footer {
            background-color: rgba(0, 0, 0, 0.1);
            color: #333;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1 class="mb-4 text-center">Pencarian Sertifikat Panitia & Pemateri/Narasumber Manasik Haji 1447 H/ 2026 M.</h1>
        <div class="input-group mb-3">
            <input type="text" id="search-input" class="form-control" placeholder="Masukkan nama Anda">
            <button id="search-button" class="btn btn-primary">Cari</button>
        </div>
        <div id="loading" class="mt-3" style="display: none;">
            <p>Mencari sertifikat, mohon tunggu...</p>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
            </div>
        </div>
        <!-- Action Buttons -->
        <div id="action-buttons" class="text-center my-3">
            <button id="print-button" class="btn btn-secondary">Cetak</button>
            <button id="download-button" class="btn btn-success">Unduh</button>
        </div>
        <div id="pdf-viewer" class="mt-4">
            <canvas id="pdf-render"></canvas>
        </div>
        <div id="not-found" class="alert alert-danger mt-3" style="display: none;">
            Nama tidak ditemukan.
        </div>
    </main>

    <footer class="text-center py-3">
        <p class="mb-0">&copy; 2026 Kantor Kementerian Haji dan Umrah Kota Gorontalo</p>
    </footer>

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
